site_name: go-pkcs7
site_description: A Go library for PKCS #7 and CMS (RFC 5652) signed, enveloped and encrypted data with per-call algorithm options, RSASSA-PSS, RSAES-OAEP and HSM keys
site_url: https://misiektoja.github.io/go-pkcs7/
repo_url: https://github.com/misiektoja/go-pkcs7
repo_name: misiektoja/go-pkcs7
copyright: Licensed under the MIT License

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# The pip requirements files live next to the pages for Dependabot but are not pages.
exclude_docs: |
  requirements.in
  requirements.txt

# The documentation build runs with --strict so every one of these findings fails the build.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - admonition
  # Code listings are included from example_test.go, where each one runs as a Go example, so the
  # pages and the code cannot drift.
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true
      dedent_subsections: true
  - toc:
      permalink: true
  - pymdownx.superfences

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Support matrix: support-matrix.md
  - Guides:
      - Signing: guide/signing.md
      - Verification: guide/verification.md
      - Encryption and decryption: guide/encryption.md
      - Pre-shared keys: guide/pre-shared-keys.md
      - Parsing: guide/parsing.md
  - Reference:
      - Options: reference/options.md
      - Algorithms: reference/algorithms.md
      - Errors: reference/errors.md
      - Compatibility policy: reference/compatibility.md
  - Interoperability:
      - OpenSSL: interoperability/openssl.md
  - Security:
      - Security model: security/security-model.md
  - Migrating from smallstep/pkcs7: migrating.md
  - Development:
      - Development: development/development.md
      - Testing: development/testing.md
      - Release process: development/release-process.md
  - Known limitations: known-limitations.md
