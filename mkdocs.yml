site_name: go-pkcs7
site_description: A Go library for PKCS #7 and CMS (RFC 5652) signed, enveloped and encrypted data with per-call algorithm options, RSASSA-PSS, RSAES-OAEP and HSM keys
site_url: https://misiektoja.github.io/go-pkcs7/
repo_url: https://github.com/misiektoja/go-pkcs7
repo_name: misiektoja/go-pkcs7
copyright: Licensed under the MIT License

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# The pip requirements files live next to the pages for Dependabot but are not pages.
exclude_docs: |
  requirements.in
  requirements.txt

# The documentation build runs with --strict so every one of these findings fails the build.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - admonition
  # The pages include sections of the README, so the two cannot drift.
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true
  - toc:
      permalink: true
  - pymdownx.superfences

nav:
  - Overview: index.md
  - Install: install.md
  - Getting started: getting-started.md
  - Guides:
      - Supported content types: guide/content-types.md
      - Security defaults: guide/security-defaults.md
  - Limitations: limitations.md
